# Stocks-in-play paper-trading bot (Alpaca PAPER account).
# Times are UTC; this week New York is UTC-5.
#   13:30 UTC = 08:30 ET  morning half: baseline, 09:35 scan, entry orders (started an hour early because
#                         GitHub can start scheduled jobs late)
#   19:30 UTC = 14:30 ET  afternoon half: 15:30 cancel, 15:55 close out, results
#   20:25 UTC = 15:25 ET  backup start for the afternoon half, in case the first one never started
# The bot refuses to place a day's orders twice, so repeated or late starts are safe.
name: paper-bot

on:
  schedule:
    - cron: "30 13 17-20 11 *"
    - cron: "30 19 17-20 11 *"
    - cron: "25 20 17-20 11 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check (places nothing), morning, afternoon or report"
        default: check

permissions:
  contents: read

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      DATA_DIR: ${{ github.workspace }}/botdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/bot/requirements.txt
      - run: pip install -r backend/bot/requirements.txt
      - name: Choose which half to run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 13 17-20 11 *" ]; then
            echo "mode=morning" >> "$GITHUB_OUTPUT"
          else
            echo "mode=afternoon" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the bot
        run: python -m backend.bot.inplay_bot ${{ steps.mode.outputs.mode }}
      - name: Results so far
        if: always() && steps.mode.outputs.mode == 'afternoon'
        run: python -m backend.bot.inplay_bot report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: |
            botdata/bot/*.log
            botdata/bot/*.json
            botdata/bot/*.csv
          if-no-files-found: ignore
