# Both paper-trading bots, every weekday (Alpaca PAPER account). The bot checks Alpaca's calendar and
# does nothing on market holidays.
# Times are UTC. 12:55 UTC is 07:55 ET in winter and 08:55 ET in summer; either way the bot builds its
# baseline and then waits for the open. The morning job trades until 12:30 ET, then the afternoon job
# takes over until just after the close. (One job cannot run longer than six hours.)
# A late start is safe: the bot simply begins from wherever the day is, and never places a day's
# stocks-in-play orders twice.
name: trading-day

on:
  schedule:
    # GitHub often starts scheduled runs late (by eight hours on 2026-11-18), so the first tries are
    # in the small hours: a run that starts early waits (the "wait" job) until 12:55 UTC. Off the
    # top of the hour, when GitHub is least busy. Later ones are backups; a backup that fires while
    # the day's run is going waits in the queue until that run ends, then finds the market shut and exits.
    - cron: "23 8 * * 1-5"
    - cron: "47 9 * * 1-5"
    - cron: "13 11 * * 1-5"
    - cron: "37 12 * * 1-5"
    - cron: "17 13 * * 1-5"
    - cron: "41 13 * * 1-5"
    - cron: "7 14 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "check (places nothing), report, or day (trade the rest of today)"
        default: check
      wait_chunk:
        description: "longest single wait in minutes before handing over to a fresh run (testing only)"
        default: "330"

permissions:
  contents: read
  actions: write   # each day's run starts the next one (GitHub's own schedule runs hours late)

concurrency:
  group: trading-day
  cancel-in-progress: false

env:
  ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
  DATA_DIR: ${{ github.workspace }}/botdata
  ALLOW_UNVALIDATED: "true"   # the signal models have not passed validation; follow their signals anyway
  MAX_STACKED_SIGNALS: "1"    # up to three open signals per ticker and timeframe, same direction only

jobs:
  # The bot keeps itself going: every trading run ends by starting the next run, and a run waits
  # here until 12:55 UTC on the next weekday (07:55 ET in winter, 08:55 ET in summer). A job can
  # only run six hours, so a long wait hands over to a fresh run every few hours. GitHub's schedule
  # (often hours late) and the laptop's backup start are only fallbacks now. Whichever run is
  # newest carries the chain on: a newer pending run replaces an older pending one.
  wait:
    if: github.event_name == 'schedule' || inputs.mode == 'day'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      handover: ${{ steps.wait.outputs.handover }}
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          CHUNK: ${{ inputs.wait_chunk || '330' }}
        run: |
          now=$(date -u +%s)
          if [ "$(date -u +%u)" -le 5 ] && [ "$now" -lt "$(date -u -d 'today 20:30' +%s)" ]; then
            target=$(date -u -d "today 12:55" +%s)
          else
            for i in 1 2 3 4 5 6 7; do
              if [ "$(date -u -d "+$i day" +%u)" -le 5 ]; then target=$(date -u -d "$(date -u -d "+$i day" +%F) 12:55" +%s); break; fi
            done
          fi
          left=$(( target - now ))
          echo "next session start $(date -u -d @$target), $(( left / 60 )) minutes away"
          if [ "$left" -le $(( CHUNK * 60 )) ]; then
            if [ "$left" -gt 0 ]; then sleep "$left"; fi
            echo "handover=false" >> "$GITHUB_OUTPUT"
          else
            sleep $(( CHUNK * 60 ))
            for try in 1 2 3 4 5; do
              gh workflow run trading-day.yml -R "$GITHUB_REPOSITORY" -f mode=day && break   # the next run waits the normal length
              sleep 30
            done
            echo "handover=true" >> "$GITHUB_OUTPUT"
          fi

  morning:
    needs: wait
    if: ${{ !cancelled() && needs.wait.outputs.handover != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/bot/requirements.txt
      - run: pip install -r backend/bot/requirements.txt
      - run: mkdir -p botdata/models && cp backend/bot/models/* botdata/models/
      - name: Check only (places nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
        run: |
          python -m backend.bot.inplay_bot check
          python -c "from backend.engine.core import Engine; e = Engine(); print('signal models loaded:', sorted(e.models))"
      - name: Report
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'report'
        run: python -m backend.bot.run_day report
      - name: Trade the morning
        if: github.event_name == 'schedule' || inputs.mode == 'day'
        run: python -m backend.bot.run_day --until 12:30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: morning-${{ github.run_id }}
          path: botdata/bot/
          if-no-files-found: ignore

  afternoon:
    needs: [wait, morning]
    if: ${{ !cancelled() && needs.wait.outputs.handover != 'true' && (github.event_name == 'schedule' || inputs.mode == 'day') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/bot/requirements.txt
      - run: pip install -r backend/bot/requirements.txt
      - run: mkdir -p botdata/models && cp backend/bot/models/* botdata/models/
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: morning-${{ github.run_id }}
          path: botdata/bot/
      - name: Trade the afternoon and close out
        run: python -m backend.bot.run_day
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: day-${{ github.run_id }}
          path: botdata/bot/
          if-no-files-found: ignore
      - name: Start tomorrow's run (it waits for the morning)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for try in 1 2 3 4 5; do
            gh workflow run trading-day.yml -R "$GITHUB_REPOSITORY" -f mode=day && exit 0
            sleep 30
          done
          exit 1
