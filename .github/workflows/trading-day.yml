# Both paper-trading bots for one trading day (Alpaca PAPER account).
# Times are UTC; this week New York is UTC-5.
#   13:55 UTC = 08:55 ET  start. The morning job trades until 12:30 ET, then the afternoon job takes over
#                         until just after the close. (One job cannot run longer than six hours.)
# A late start is safe: the bot simply begins from wherever the day is, and never places a day's
# stocks-in-play orders twice.
name: trading-day

on:
  schedule:
    - cron: "55 13 18-20 11 *"
    # Backups: GitHub sometimes skips a scheduled start. A backup that fires while the day's run is
    # going waits in the queue until that run ends after the close, then finds the market shut and exits.
    - cron: "12 14 18-20 11 *"
    - cron: "33 14 18-20 11 *"
    - cron: "7 15 18-20 11 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check (places nothing), report, or day (trade the rest of today)"
        default: check

permissions:
  contents: read

concurrency:
  group: trading-day
  cancel-in-progress: false

env:
  ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
  DATA_DIR: ${{ github.workspace }}/botdata
  ALLOW_UNVALIDATED: "true"   # the signal models have not passed validation; follow their signals anyway

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/bot/requirements.txt
      - run: pip install -r backend/bot/requirements.txt
      - run: mkdir -p botdata/models && cp backend/bot/models/* botdata/models/
      - name: Check only (places nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
        run: |
          python -m backend.bot.inplay_bot check
          python -c "from backend.engine.core import Engine; e = Engine(); print('signal models loaded:', sorted(e.models))"
      - name: Report
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'report'
        run: python -m backend.bot.run_day report
      - name: Trade the morning
        if: github.event_name == 'schedule' || inputs.mode == 'day'
        run: python -m backend.bot.run_day --until 12:30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morning-${{ github.run_id }}
          path: botdata/bot/
          if-no-files-found: ignore

  afternoon:
    needs: morning
    if: always() && (github.event_name == 'schedule' || inputs.mode == 'day')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/bot/requirements.txt
      - run: pip install -r backend/bot/requirements.txt
      - run: mkdir -p botdata/models && cp backend/bot/models/* botdata/models/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: morning-${{ github.run_id }}
          path: botdata/bot/
      - name: Trade the afternoon and close out
        run: python -m backend.bot.run_day
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: day-${{ github.run_id }}
          path: botdata/bot/
          if-no-files-found: ignore
